name: marine-ebook-test

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: marine_ebook_test
      MYSQL_USER: marine_test
      MYSQL_PASSWORD: marine-test-password
      MYSQL_ROOT_PASSWORD: marine-test-root-password
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
