name: marine-ebook-delivery

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-marine_ebook}
      MYSQL_USER: ${MYSQL_USER:-marine_ebook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先复制并填写 .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先填写 MySQL root 密码}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-marine_ebook}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-marine_ebook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先填写数据库密码}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_ROOT: /app/uploads
      INITIAL_SUPER_ADMIN_USERNAME: ${INITIAL_SUPER_ADMIN_USERNAME:?请先填写首次总管理员登录名}
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD:?请先填写首次总管理员密码}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  uploads:
